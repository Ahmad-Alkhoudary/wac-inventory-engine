services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wac_app
    restart: unless-stopped
    tty: true
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - wac_network

  webserver:
    image: nginx:alpine
    container_name: wac_webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wac_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: wac_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: wac_inventory
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - wac_network

networks:
  wac_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
